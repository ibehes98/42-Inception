listen=YES
listen_ipv6=NO
background=NO

anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022

chroot_local_user=YES
allow_writeable_chroot=YES
secure_chroot_dir=/var/run/vsftpd/empty

userlist_enable=YES
userlist_file=/etc/vsftpd.userlist
userlist_deny=NO

pasv_enable=YES
pasv_min_port=21100
pasv_max_port=21110
pasv_address=PASV_ADDRESS

ssl_enable=YES
rsa_cert_file=/etc/ssl/vsftpd/vsftpd.crt
rsa_private_key_file=/etc/ssl/vsftpd/vsftpd.key
force_local_logins_ssl=YES
force_local_data_ssl=YES
allow_anon_ssl=NO
ssl_sslv2=NO
ssl_sslv3=NO
ssl_ciphers=HIGH
require_ssl_reuse=NO

max_login_fails=3
delay_failed_login=5
max_per_ip=3
max_clients=10

deny_file={*.php,*.php[0-9],*.phtml,*.phar,.htaccess,.user.ini}
chmod_enable=NO
hide_ids=YES

xferlog_enable=YES
xferlog_std_format=NO
log_ftp_protocol=YES
vsftpd_log_file=/var/log/vsftpd.log

pam_service_name=vsftpd
seccomp_sandbox=NO
ftpd_banner=Servidor FTP de Inception